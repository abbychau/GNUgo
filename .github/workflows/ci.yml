# Build GNU Go natively (Linux, Windows, macOS), with UBSan, and as
# WebAssembly; run the regression suites; publish the web demo and the
# manual to GitHub Pages from master. Releases are made by release.yml,
# which reuses the builds of this workflow.
name: CI

on:
  push:
    branches: [master, main]
    paths-ignore: &docs-only
      - "**.md"
      - NEWS
      - doc/TODO
      - doc/AUTHORS
      - doc/THANKS
      - doc/ChangeLog
      - .editorconfig
      - .github/dependabot.yml
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-latest,  exe: build/src/interface/gnugo }
          - { name: windows-x64, os: windows-latest, exe: build/src/interface/Release/gnugo.exe }
          - { name: macos-arm64, os: macos-latest,   exe: build/src/interface/gnugo }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The Visual Studio generator cannot use a compiler launcher.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        if: runner.os != 'Windows'
        with:
          key: native-${{ matrix.name }}

      - name: Configure
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then
            launcher=-DCMAKE_C_COMPILER_LAUNCHER=ccache
          fi
          cmake --preset release ${launcher:+"$launcher"}

      - name: Build
        run: cmake --build --preset release --parallel 4

      - name: Regression tests
        run: ctest --preset release -j 4

      - name: Package
        run: |
          dir=gnugo-${{ matrix.name }}
          mkdir -p dist/$dir
          cp "${{ matrix.exe }}" COPYING README.md NEWS doc/gnugo.6 dist/$dir/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip ../gnugo-${{ matrix.name }}.zip $dir >/dev/null
          else
            tar czf ../gnugo-${{ matrix.name }}.tar.gz $dir
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: gnugo-${{ matrix.name }}
          path: gnugo-${{ matrix.name }}.*
          if-no-files-found: error

  # Undefined behavior is fatal here: any UBSan report aborts the engine,
  # which fails the suite.
  ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ubsan

      - name: Configure
        run: cmake --preset ubsan -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset ubsan --parallel 4

      - name: Regression tests under UBSan
        env:
          GNUGO_STDERR: ${{ runner.temp }}/ubsan.log
        run: ctest --preset ubsan -j 4

      - name: Show UBSan reports
        if: failure()
        run: grep -A15 "runtime error" "${{ runner.temp }}/ubsan.log" | head -100 || true

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 7.0.0
          actions-cache-folder: emsdk-cache

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: wasm-native

      - name: Set EMSDK for the preset
        run: |
          emsdk_dir=${EMSDK:-$(cd "$(dirname "$(command -v emcc)")/../.." && pwd)}
          echo "EMSDK=$emsdk_dir" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset wasm

      - name: Build
        run: cmake --build --preset wasm --parallel 4

      # The 11 regression suites under node, plus the module smoke test.
      - name: Tests
        run: ctest --preset wasm -j 4

      # The native and WebAssembly builds must choose identical moves; a
      # difference means undefined or platform-dependent behavior.
      - name: Native build for comparison
        run: |
          cmake --preset release -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build --preset release --parallel 4 --target gnugo

      - name: Compare native and WebAssembly moves
        run: >
          python tests/tools/compare_engines.py build/src/interface/gnugo
          build-wasm/src/interface/gnugo.js --moves 40

      - name: Package
        run: |
          mkdir -p dist
          cp -r build-wasm/web dist/gnugo-wasm
          (cd dist && zip -qr ../gnugo-wasm.zip gnugo-wasm)
          # npm package tarball (build-wasm/web is the package root).
          (cd build-wasm/web && npm pack --pack-destination ../..)
          mv abbychau-gnugo-wasm-*.tgz gnugo-wasm-npm.tgz

      - uses: actions/upload-artifact@v7
        with:
          name: gnugo-wasm
          path: |
            gnugo-wasm.zip
            gnugo-wasm-npm.tgz
          if-no-files-found: error

      # GitHub Pages: the demo at the root, the pages in pages/ next to it,
      # and the manual under manual/.
      - name: Build the manual
        run: |
          sudo apt-get install -y -qq texinfo >/dev/null
          cmake --preset release
          cmake --build --preset release --target manual

      - name: Assemble the site
        run: |
          cp -r build-wasm/web site
          cp -r pages/. site/
          cp -r build/manual site/manual

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [native, ubsan, wasm]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
